<svg width="1600" height="1160" viewBox="0 0 1600 1160" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1600" y2="1160" gradientUnits="userSpaceOnUse">
      <stop stop-color="#EEF4FB"/>
      <stop offset="1" stop-color="#F7FAFE"/>
    </linearGradient>
    <linearGradient id="hero" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#F5F9FE"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="18" flood-color="#12355C" flood-opacity="0.12"/>
    </filter>
    <style>
      .title { font: 700 34px Roboto, Arial, sans-serif; fill: #143A62; }
      .h2 { font: 700 24px Roboto, Arial, sans-serif; fill: #173A63; }
      .h3 { font: 700 18px Roboto, Arial, sans-serif; fill: #173A63; }
      .body { font: 500 16px Roboto, Arial, sans-serif; fill: #4C627C; }
      .small { font: 500 13px Roboto, Arial, sans-serif; fill: #667E98; }
      .step { font: 700 13px Roboto, Arial, sans-serif; fill: #1660B3; }
      .mono { font: 500 14px "Roboto Mono", monospace; fill: #264766; }
      .white { fill: #FFFFFF; }
      .chip { font: 700 13px Roboto, Arial, sans-serif; fill: #0E4C92; }
    </style>
  </defs>

  <rect width="1600" height="1160" fill="url(#bg)"/>

  <rect x="34" y="28" width="1532" height="92" rx="22" fill="url(#hero)" stroke="#D7E4F2" filter="url(#shadow)"/>
  <text x="62" y="69" class="title">Image Metadata Assistant</text>
  <text x="62" y="96" class="body">Progressive disclosure version: only the current step is expanded. Completed steps collapse into compact summaries so the flow stays clear.</text>

  <rect x="34" y="142" width="1532" height="82" rx="22" fill="#FFFFFF" stroke="#D7E4F2" filter="url(#shadow)"/>
  <circle cx="90" cy="183" r="20" fill="#E8F1FC" stroke="#1565C0" stroke-width="3"/>
  <text x="82" y="189" class="step" style="font-size:15px;">1</text>
  <text x="120" y="177" class="step">Select Source</text>
  <text x="120" y="197" class="small">Completed</text>
  <line x1="260" y1="183" x2="330" y2="183" stroke="#8DB6E6" stroke-width="4" stroke-linecap="round"/>
  <circle cx="372" cy="183" r="20" fill="#1565C0"/>
  <text x="364" y="189" class="white" style="font:700 15px Roboto, Arial, sans-serif;">2</text>
  <text x="402" y="177" class="step">Configure</text>
  <text x="402" y="197" class="small">Current step</text>
  <line x1="520" y1="183" x2="590" y2="183" stroke="#D6E1EE" stroke-width="4" stroke-linecap="round"/>
  <circle cx="632" cy="183" r="20" fill="#FFFFFF" stroke="#C4D4E6" stroke-width="3"/>
  <text x="624" y="189" class="small" style="font-weight:700; fill:#5E7691;">3</text>
  <text x="662" y="177" class="small" style="font-weight:700; fill:#173A63;">Process</text>
  <text x="662" y="197" class="small">Next</text>
  <line x1="774" y1="183" x2="844" y2="183" stroke="#D6E1EE" stroke-width="4" stroke-linecap="round"/>
  <circle cx="886" cy="183" r="20" fill="#FFFFFF" stroke="#C4D4E6" stroke-width="3"/>
  <text x="878" y="189" class="small" style="font-weight:700; fill:#5E7691;">4</text>
  <text x="916" y="177" class="small" style="font-weight:700; fill:#173A63;">Review</text>
  <text x="916" y="197" class="small">Later</text>
  <line x1="1016" y1="183" x2="1086" y2="183" stroke="#D6E1EE" stroke-width="4" stroke-linecap="round"/>
  <circle cx="1128" cy="183" r="20" fill="#FFFFFF" stroke="#C4D4E6" stroke-width="3"/>
  <text x="1120" y="189" class="small" style="font-weight:700; fill:#5E7691;">5</text>
  <text x="1158" y="177" class="small" style="font-weight:700; fill:#173A63;">Finish</text>
  <text x="1158" y="197" class="small">Last</text>

  <rect x="34" y="248" width="1532" height="88" rx="20" fill="#FFFFFF" stroke="#D7E4F2" filter="url(#shadow)"/>
  <text x="60" y="286" class="h2">Step 1 Summary</text>
  <text x="60" y="313" class="body">Source selected: local folder with 627 images, 627 writable. Completed steps stay visible but collapsed.</text>
  <rect x="1328" y="270" width="182" height="40" rx="14" fill="#F5FAFF" stroke="#B8CCE6"/>
  <text x="1362" y="295" class="chip">Edit Source</text>

  <rect x="34" y="358" width="1532" height="360" rx="22" fill="#FFFFFF" stroke="#D7E4F2" filter="url(#shadow)"/>
  <text x="60" y="398" class="h2">Step 2: Configure Run</text>
  <text x="60" y="425" class="body">Only the active step is fully expanded. The user sees exactly what to do next.</text>

  <rect x="60" y="452" width="470" height="108" rx="16" fill="#F7FAFE" stroke="#D8E4F2"/>
  <text x="84" y="482" class="small" style="font-weight:700; fill:#173A63;">Automatic Model Strategy</text>
  <text x="84" y="512" class="body">Fast mode or large queues: BLIP Base + OWL-ViT Base</text>
  <text x="84" y="538" class="body">High recall or small queues: BLIP Large + OWL-ViT Large</text>

  <rect x="550" y="452" width="470" height="108" rx="16" fill="#E8F1FC" stroke="#8DB6E6"/>
  <text x="574" y="482" class="small" style="font-weight:700; fill:#173A63;">Recommended Preset</text>
  <text x="574" y="518" class="body">Balanced</text>
  <text x="574" y="542" class="small">Auto-apply on, skip existing on, IP risk on</text>

  <rect x="1040" y="452" width="470" height="108" rx="16" fill="#F7FAFE" stroke="#D8E4F2"/>
  <text x="1064" y="482" class="small" style="font-weight:700; fill:#173A63;">Why this is better</text>
  <text x="1064" y="512" class="body">No model decision fatigue. Options stay focused on outcome and speed.</text>

  <rect x="60" y="584" width="1450" height="102" rx="16" fill="#FBFDFF" stroke="#D8E4F2"/>
  <text x="84" y="616" class="small" style="font-weight:700; fill:#173A63;">Processing Options</text>
  <text x="84" y="646" class="body">Fast Analysis Mode</text>
  <text x="84" y="670" class="body">Skip Existing Metadata</text>
  <text x="362" y="646" class="body">High Recall Mode</text>
  <text x="362" y="670" class="body">Check Metadata Quality</text>
  <text x="640" y="646" class="body">Repair Metadata Only</text>
  <text x="640" y="670" class="body">Copyright / IP Risk Check</text>
  <text x="972" y="646" class="body">Auto-apply Metadata</text>
  <text x="972" y="670" class="body">Auto-restore + Resume</text>
  <rect x="250" y="631" width="54" height="26" rx="13" fill="#1565C0"/><circle cx="289" cy="644" r="9" fill="#FFFFFF"/>
  <rect x="250" y="655" width="54" height="26" rx="13" fill="#1565C0"/><circle cx="289" cy="668" r="9" fill="#FFFFFF"/>
  <rect x="528" y="631" width="54" height="26" rx="13" fill="#DCE6F3"/><circle cx="543" cy="644" r="9" fill="#FFFFFF"/>
  <rect x="528" y="655" width="54" height="26" rx="13" fill="#DCE6F3"/><circle cx="543" cy="668" r="9" fill="#FFFFFF"/>
  <rect x="848" y="631" width="54" height="26" rx="13" fill="#DCE6F3"/><circle cx="863" cy="644" r="9" fill="#FFFFFF"/>
  <rect x="848" y="655" width="54" height="26" rx="13" fill="#1565C0"/><circle cx="887" cy="668" r="9" fill="#FFFFFF"/>
  <rect x="1198" y="631" width="54" height="26" rx="13" fill="#1565C0"/><circle cx="1237" cy="644" r="9" fill="#FFFFFF"/>
  <rect x="1198" y="655" width="54" height="26" rx="13" fill="#1565C0"/><circle cx="1237" cy="668" r="9" fill="#FFFFFF"/>

  <rect x="1322" y="620" width="188" height="48" rx="16" fill="#1565C0"/>
  <text x="1362" y="650" class="white" style="font:700 16px Roboto, Arial, sans-serif;">Continue to Process</text>

  <rect x="34" y="740" width="1532" height="92" rx="20" fill="#FFFFFF" stroke="#D7E4F2" filter="url(#shadow)"/>
  <text x="60" y="778" class="h2">Step 3 Summary</text>
  <text x="60" y="805" class="body">This step stays collapsed until the user continues. Once expanded, image preview and progress appear immediately below the stepper.</text>
  <rect x="1308" y="762" width="202" height="40" rx="14" fill="#F5FAFF" stroke="#B8CCE6"/>
  <text x="1350" y="787" class="chip">Expand Process</text>

  <rect x="34" y="854" width="1532" height="92" rx="20" fill="#FFFFFF" stroke="#D7E4F2" filter="url(#shadow)"/>
  <text x="60" y="892" class="h2">Step 4 Summary</text>
  <text x="60" y="919" class="body">Metadata review stays hidden until results exist. That keeps the early flow simple and reduces cognitive load.</text>
  <rect x="1308" y="876" width="202" height="40" rx="14" fill="#F5FAFF" stroke="#B8CCE6"/>
  <text x="1356" y="901" class="chip">Expand Review</text>

  <rect x="34" y="968" width="1532" height="126" rx="20" fill="#FFFFFF" stroke="#D7E4F2" filter="url(#shadow)"/>
  <text x="60" y="1006" class="h2">Step 5 Summary</text>
  <text x="60" y="1033" class="body">Finish stays collapsed until the run ends. Export and log only appear when they matter.</text>
  <rect x="60" y="1050" width="190" height="28" rx="14" fill="#EEF4FD"/><text x="114" y="1068" class="chip">Export Index</text>
  <rect x="264" y="1050" width="150" height="28" rx="14" fill="#EEF4FD"/><text x="314" y="1068" class="chip">Show Log</text>
  <rect x="1308" y="1018" width="202" height="40" rx="14" fill="#F5FAFF" stroke="#B8CCE6"/>
  <text x="1360" y="1043" class="chip">Expand Finish</text>
</svg>
