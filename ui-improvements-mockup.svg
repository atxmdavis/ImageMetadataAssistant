<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="980" viewBox="0 0 1600 980">
  <defs>
    <linearGradient id="bg" x1="0" x2="0" y1="0" y2="1">
      <stop offset="0%" stop-color="#f7f9fc"/>
      <stop offset="100%" stop-color="#eef3f9"/>
    </linearGradient>
    <style>
      .title { font: 700 30px 'Roboto', sans-serif; fill:#0e2f52; }
      .h2 { font: 700 22px 'Roboto', sans-serif; fill:#143d68; }
      .h3 { font: 700 17px 'Roboto', sans-serif; fill:#1f4f7e; }
      .txt { font: 500 15px 'Roboto', sans-serif; fill:#274f77; }
      .muted { font: 500 13px 'Roboto', sans-serif; fill:#5c7893; }
      .chip { font: 700 13px 'Roboto', sans-serif; fill:#1a4167; }
      .btn { font: 700 15px 'Roboto', sans-serif; fill:white; }
      .btn2 { font: 700 14px 'Roboto', sans-serif; fill:#1b4e7d; }
      .small { font: 500 12px 'Roboto', sans-serif; fill:#5e7a92; }
      .mono { font: 500 12px 'Roboto Mono', monospace; fill:#2c4e73; }
    </style>
  </defs>

  <rect x="0" y="0" width="1600" height="980" fill="url(#bg)"/>

  <rect x="24" y="20" width="1552" height="76" rx="12" fill="#ffffff" stroke="#cfdeef"/>
  <text x="46" y="64" class="title">Image Metadata Assistant</text>

  <rect x="24" y="108" width="1552" height="110" rx="12" fill="#ffffff" stroke="#cfdeef"/>
  <text x="44" y="138" class="h3">Select Source</text>
  <rect x="44" y="152" width="150" height="38" rx="10" fill="#f4f8fe" stroke="#b8cde6"/><text x="73" y="176" class="btn2">Select Folder</text>
  <rect x="206" y="152" width="150" height="38" rx="10" fill="#f4f8fe" stroke="#b8cde6"/><text x="242" y="176" class="btn2">Select Image</text>
  <rect x="368" y="152" width="150" height="38" rx="10" fill="#f4f8fe" stroke="#b8cde6"/><text x="399" y="176" class="btn2">Local Folder</text>
  <rect x="530" y="152" width="150" height="38" rx="10" fill="#f4f8fe" stroke="#b8cde6"/><text x="568" y="176" class="btn2">Local Image</text>
  <text x="720" y="138" class="h3">Current Source</text>
  <rect x="720" y="152" width="136" height="30" rx="15" fill="#e7f1ff" stroke="#95bae6"/><text x="746" y="172" class="chip">Browser Folder</text>
  <rect x="870" y="152" width="112" height="30" rx="15" fill="#f6f9fd" stroke="#c4d8ee"/><text x="901" y="172" class="chip">Writable</text>
  <text x="1040" y="138" class="h3">Model Selection</text>
  <rect x="1040" y="152" width="244" height="38" rx="10" fill="#ffffff" stroke="#b6c9e0"/>
  <text x="1052" y="176" class="txt">Description: BLIP Base</text>
  <rect x="1294" y="152" width="244" height="38" rx="10" fill="#ffffff" stroke="#b6c9e0"/>
  <text x="1306" y="176" class="txt">Detector: OWL-ViT Base</text>

  <!-- Left column -->
  <rect x="24" y="232" width="880" height="720" rx="12" fill="#ffffff" stroke="#cfdeef"/>
  <text x="46" y="266" class="h2">Current Image</text>

  <!-- Sticky run header concept -->
  <rect x="44" y="278" width="840" height="52" rx="10" fill="#f5f9ff" stroke="#c7daef"/>
  <text x="60" y="308" class="txt">Status: Running</text>
  <text x="240" y="308" class="txt">Progress: 8,542 / 219,000</text>
  <text x="470" y="308" class="txt">Skipped: 4,982</text>
  <text x="615" y="308" class="txt">ETA: Mar 12, 8:40 PM</text>
  <rect x="778" y="288" width="96" height="30" rx="8" fill="#c62828"/><text x="808" y="308" class="btn">Stop</text>

  <rect x="44" y="346" width="840" height="430" rx="12" fill="#f8fbff" stroke="#c2d5ec" stroke-dasharray="6 5"/>
  <rect x="74" y="386" width="780" height="350" rx="8" fill="#e8f0fb" stroke="#bed0e8"/>
  <text x="350" y="565" class="muted">Image Preview</text>

  <text x="44" y="802" class="mono">Very_long_file_name_truncated_for_layout_stability...png</text>
  <rect x="44" y="820" width="180" height="42" rx="10" fill="#1565c0"/><text x="76" y="846" class="btn">Start Processing</text>

  <!-- Processing options moved below button -->
  <rect x="44" y="876" width="840" height="62" rx="10" fill="#fbfdff" stroke="#d4e1f1"/>
  <text x="58" y="902" class="h3">Processing Options</text>
  <rect x="206" y="884" width="102" height="24" rx="12" fill="#eaf3ff" stroke="#9ec0e5"/><text x="224" y="901" class="chip">Fast Bulk</text>
  <rect x="316" y="884" width="88" height="24" rx="12" fill="#f5f9fe" stroke="#bfd4ea"/><text x="339" y="901" class="chip">Balanced</text>
  <rect x="410" y="884" width="108" height="24" rx="12" fill="#f5f9fe" stroke="#bfd4ea"/><text x="433" y="901" class="chip">High Accuracy</text>
  <rect x="524" y="884" width="88" height="24" rx="12" fill="#f5f9fe" stroke="#bfd4ea"/><text x="546" y="901" class="chip">Audit Only</text>
  <text x="626" y="902" class="small">Grouped toggles: Speed | Quality | Safety | Write</text>

  <!-- Progress card -->
  <rect x="24" y="960" width="880" height="0" fill="none"/>

  <!-- Right column -->
  <rect x="920" y="232" width="656" height="720" rx="12" fill="#ffffff" stroke="#cfdeef"/>
  <text x="942" y="266" class="h2">Generated Metadata</text>

  <text x="942" y="302" class="h3">Description</text>
  <rect x="942" y="312" width="612" height="70" rx="8" fill="#f8fbff" stroke="#bfd2ea"/>

  <text x="942" y="412" class="h3">Keywords</text>
  <rect x="942" y="422" width="612" height="58" rx="8" fill="#f8fbff" stroke="#bfd2ea"/>

  <text x="942" y="510" class="h3">Actions</text>
  <rect x="942" y="520" width="612" height="58" rx="8" fill="#f8fbff" stroke="#bfd2ea"/>

  <text x="942" y="608" class="h3">Colors</text>
  <rect x="942" y="618" width="612" height="56" rx="8" fill="#f8fbff" stroke="#bfd2ea"/>
  <rect x="956" y="633" width="95" height="28" rx="14" fill="#eef4fd" stroke="#c6d5ea"/><text x="986" y="651" class="chip">blue</text>
  <rect x="1060" y="633" width="95" height="28" rx="14" fill="#eef4fd" stroke="#c6d5ea"/><text x="1087" y="651" class="chip">orange</text>
  <rect x="1164" y="633" width="95" height="28" rx="14" fill="#eef4fd" stroke="#c6d5ea"/><text x="1192" y="651" class="chip">yellow</text>

  <text x="942" y="710" class="h3">Copyright/IP Risk</text>
  <rect x="942" y="720" width="612" height="92" rx="8" fill="#fbfdff" stroke="#d3e0f0"/>
  <rect x="956" y="738" width="62" height="26" rx="13" fill="#eef8ed" stroke="#bbddb7"/><text x="976" y="756" class="chip">LOW</text>
  <rect x="1028" y="738" width="84" height="26" rx="13" fill="#fff3df" stroke="#e2c08f"/><text x="1052" y="756" class="chip">MEDIUM</text>
  <rect x="1122" y="738" width="64" height="26" rx="13" fill="#fde8e8" stroke="#e6b3b2"/><text x="1143" y="756" class="chip">HIGH</text>
  <rect x="956" y="774" width="132" height="28" rx="14" fill="#eef4fd" stroke="#c6d5ea"/><text x="983" y="792" class="chip">star wars</text>
  <text x="1098" y="792" class="txt">46%</text>

  <rect x="942" y="836" width="172" height="42" rx="10" fill="#1565c0"/><text x="986" y="862" class="btn">Add Metadata</text>
  <rect x="1126" y="836" width="190" height="42" rx="10" fill="#ffffff" stroke="#9db8de"/><text x="1161" y="862" class="btn2">Remove Metadata</text>

  <!-- Live log left bottom -->
  <rect x="24" y="880" width="0" height="0" fill="none"/>
  <rect x="24" y="952" width="1552" height="0" fill="none"/>

  <rect x="24" y="952" width="1552" height="0" fill="none"/>

  <!-- Floating help modal preview -->
  <rect x="420" y="160" width="760" height="520" rx="12" fill="#ffffff" stroke="#c5d6ee"/>
  <text x="448" y="198" class="h2">Processing Options Help</text>
  <rect x="1116" y="174" width="36" height="36" rx="18" fill="#ffffff" stroke="#9db8de"/><text x="1129" y="198" class="txt">X</text>
  <text x="448" y="236" class="txt">Automatically add metadata without confirmation: writes metadata immediately.</text>
  <text x="448" y="272" class="txt">Skip images with existing keywords/categories: reduces resume time.</text>
  <text x="448" y="308" class="txt">High Recall Mode: better small object detection, slower.</text>
  <text x="448" y="344" class="txt">Fast Analysis Mode: improves throughput on large batches.</text>
  <text x="448" y="380" class="txt">Check metadata quality: catches missing/duplicate/repeated terms.</text>
  <text x="448" y="416" class="txt">Repair metadata only: no full image inference.</text>
  <text x="448" y="452" class="txt">Read-only audit mode: no writes, verification only.</text>
  <text x="448" y="488" class="txt">Remove metadata only: batch remove app metadata.</text>
  <text x="448" y="524" class="txt">Detect duplicates: flags visual near-duplicates.</text>
  <text x="448" y="560" class="txt">Copyright/IP risk check: flags likely trademark/IP cues.</text>
  <rect x="1006" y="610" width="146" height="42" rx="10" fill="#ffffff" stroke="#9db8de"/>
  <text x="1054" y="636" class="btn2">Close</text>

</svg>
