<svg width="1600" height="1080" viewBox="0 0 1600 1080" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1600" y2="1080" gradientUnits="userSpaceOnUse">
      <stop stop-color="#EEF4FB"/>
      <stop offset="1" stop-color="#F7FAFE"/>
    </linearGradient>
    <linearGradient id="hero" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#F4F8FE"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="18" flood-color="#12355C" flood-opacity="0.12"/>
    </filter>
    <style>
      .title { font: 700 34px Roboto, Arial, sans-serif; fill: #143A62; }
      .h2 { font: 700 26px Roboto, Arial, sans-serif; fill: #173A63; }
      .h3 { font: 700 20px Roboto, Arial, sans-serif; fill: #173A63; }
      .body { font: 500 16px Roboto, Arial, sans-serif; fill: #4B627C; }
      .mono { font: 500 14px "Roboto Mono", monospace; fill: #264766; }
      .small { font: 500 13px Roboto, Arial, sans-serif; fill: #627B96; }
      .chip { font: 700 13px Roboto, Arial, sans-serif; fill: #0F4D92; }
      .step { font: 700 14px Roboto, Arial, sans-serif; fill: #1D5FAF; }
      .white { fill: #FFFFFF; }
    </style>
  </defs>

  <rect width="1600" height="1080" fill="url(#bg)"/>

  <rect x="34" y="28" width="1532" height="90" rx="22" fill="url(#hero)" stroke="#D8E4F2" filter="url(#shadow)"/>
  <text x="64" y="68" class="title">Image Metadata Assistant</text>
  <text x="64" y="95" class="body">Clear flow: Select source, configure, process, review, then export. Image preview and progress stay near the top for constant visibility.</text>

  <rect x="34" y="138" width="1532" height="92" rx="22" fill="#FFFFFF" stroke="#D8E4F2" filter="url(#shadow)"/>
  <circle cx="90" cy="184" r="22" fill="#1565C0"/>
  <text x="82" y="190" class="white" style="font:700 16px Roboto, Arial, sans-serif;">1</text>
  <text x="124" y="178" class="step">Select Source</text>
  <text x="124" y="199" class="small">Folder, image, or local mode</text>
  <line x1="270" y1="184" x2="350" y2="184" stroke="#8DB6E6" stroke-width="4" stroke-linecap="round"/>
  <circle cx="394" cy="184" r="22" fill="#E7F0FC" stroke="#1565C0" stroke-width="3"/>
  <text x="386" y="190" class="step">2</text>
  <text x="428" y="178" class="step">Configure</text>
  <text x="428" y="199" class="small">Models and processing options</text>
  <line x1="576" y1="184" x2="656" y2="184" stroke="#D3E0EF" stroke-width="4" stroke-linecap="round"/>
  <circle cx="700" cy="184" r="22" fill="#FFFFFF" stroke="#C5D4E6" stroke-width="3"/>
  <text x="692" y="190" class="small" style="font-weight:700; fill:#59728E;">3</text>
  <text x="734" y="178" class="small" style="font-weight:700; fill:#173A63;">Process</text>
  <text x="734" y="199" class="small">Run queue and monitor status</text>
  <line x1="884" y1="184" x2="964" y2="184" stroke="#D3E0EF" stroke-width="4" stroke-linecap="round"/>
  <circle cx="1008" cy="184" r="22" fill="#FFFFFF" stroke="#C5D4E6" stroke-width="3"/>
  <text x="1000" y="190" class="small" style="font-weight:700; fill:#59728E;">4</text>
  <text x="1042" y="178" class="small" style="font-weight:700; fill:#173A63;">Review</text>
  <text x="1042" y="199" class="small">Edit metadata if needed</text>
  <line x1="1168" y1="184" x2="1248" y2="184" stroke="#D3E0EF" stroke-width="4" stroke-linecap="round"/>
  <circle cx="1292" cy="184" r="22" fill="#FFFFFF" stroke="#C5D4E6" stroke-width="3"/>
  <text x="1284" y="190" class="small" style="font-weight:700; fill:#59728E;">5</text>
  <text x="1326" y="178" class="small" style="font-weight:700; fill:#173A63;">Finish</text>
  <text x="1326" y="199" class="small">Export and next actions</text>

  <rect x="34" y="252" width="460" height="250" rx="22" fill="#FFFFFF" stroke="#D8E4F2" filter="url(#shadow)"/>
  <text x="62" y="292" class="h2">Source + Run Setup</text>
  <text x="62" y="320" class="body">Keep first actions together so the user knows where to begin.</text>
  <rect x="62" y="350" width="168" height="50" rx="16" fill="#1565C0"/>
  <text x="100" y="381" class="white" style="font:700 16px Roboto, Arial, sans-serif;">Select Folder</text>
  <rect x="246" y="350" width="168" height="50" rx="16" fill="#FFFFFF" stroke="#9DB8DE" stroke-width="2"/>
  <text x="288" y="381" class="step" style="font-size:16px;">Select Image</text>
  <rect x="62" y="420" width="352" height="50" rx="16" fill="#F6FAFF" stroke="#D8E4F2"/>
  <text x="84" y="451" class="body">Selection: Folder with 627 images, 627 writable</text>

  <rect x="524" y="252" width="1042" height="250" rx="22" fill="#FFFFFF" stroke="#D8E4F2" filter="url(#shadow)"/>
  <text x="552" y="292" class="h2">Current Image + Progress</text>
  <text x="552" y="320" class="body">The most important runtime feedback stays above the fold.</text>
  <rect x="552" y="340" width="420" height="132" rx="18" fill="#0F2440"/>
  <rect x="570" y="356" width="384" height="96" rx="14" fill="#233B57"/>
  <circle cx="732" cy="404" r="26" fill="#FFD54F" fill-opacity="0.9"/>
  <rect x="692" y="390" width="88" height="28" rx="14" fill="#1565C0" fill-opacity="0.85"/>
  <text x="582" y="447" class="white" style="font:700 18px Roboto, Arial, sans-serif;">Preview stays fixed-size here</text>
  <text x="552" y="490" class="mono">current_file_name_truncated_example_001.png</text>

  <rect x="1000" y="340" width="536" height="54" rx="16" fill="#F7FAFE" stroke="#D8E4F2"/>
  <text x="1024" y="373" class="body">Progress: 176 / 627 (28%)</text>
  <rect x="1024" y="406" width="468" height="14" rx="7" fill="#E3ECF8"/>
  <rect x="1024" y="406" width="131" height="14" rx="7" fill="#1565C0"/>
  <text x="1024" y="450" class="small">Elapsed: 03:05</text>
  <text x="1202" y="450" class="small">Remaining: 07:22</text>
  <text x="1380" y="450" class="small">ETA: Mar 8, 7:45 PM</text>
  <rect x="1402" y="356" width="106" height="32" rx="16" fill="#EEF4FD" stroke="#B7CBE6"/>
  <text x="1426" y="377" class="chip">Skipped: 0</text>
  <rect x="1024" y="448" width="172" height="42" rx="16" fill="#B3261E"/>
  <text x="1058" y="474" class="white" style="font:700 16px Roboto, Arial, sans-serif;">Stop Processing</text>

  <rect x="34" y="526" width="460" height="520" rx="22" fill="#FFFFFF" stroke="#D8E4F2" filter="url(#shadow)"/>
  <text x="62" y="566" class="h2">Configuration</text>
  <text x="62" y="592" class="body">Presets first, advanced settings second.</text>
  <rect x="62" y="620" width="368" height="54" rx="16" fill="#E8F1FC" stroke="#8DB6E6"/>
  <text x="86" y="653" class="step" style="font-size:16px;">Preset: Balanced</text>
  <rect x="62" y="696" width="368" height="78" rx="16" fill="#F7FAFE" stroke="#D8E4F2"/>
  <text x="84" y="728" class="small" style="font-weight:700; fill:#173A63;">Description Model</text>
  <text x="84" y="754" class="body">BLIP Base (Balanced)</text>
  <rect x="62" y="792" width="368" height="78" rx="16" fill="#F7FAFE" stroke="#D8E4F2"/>
  <text x="84" y="824" class="small" style="font-weight:700; fill:#173A63;">Object Detection Model</text>
  <text x="84" y="850" class="body">OWL-ViT Base (Balanced)</text>
  <rect x="62" y="888" width="368" height="130" rx="16" fill="#FBFDFF" stroke="#D8E4F2"/>
  <text x="84" y="920" class="small" style="font-weight:700; fill:#173A63;">Processing Options</text>
  <text x="84" y="950" class="body">Auto-apply metadata</text>
  <text x="84" y="978" class="body">Skip existing metadata</text>
  <text x="84" y="1006" class="body">IP risk check</text>
  <rect x="344" y="936" width="58" height="28" rx="14" fill="#1565C0"/>
  <circle cx="388" cy="950" r="10" fill="#FFFFFF"/>
  <rect x="344" y="964" width="58" height="28" rx="14" fill="#1565C0"/>
  <circle cx="388" cy="978" r="10" fill="#FFFFFF"/>
  <rect x="344" y="992" width="58" height="28" rx="14" fill="#DCE6F3"/>
  <circle cx="358" cy="1006" r="10" fill="#FFFFFF"/>

  <rect x="524" y="526" width="1042" height="520" rx="22" fill="#FFFFFF" stroke="#D8E4F2" filter="url(#shadow)"/>
  <text x="552" y="566" class="h2">Generated Metadata</text>
  <text x="552" y="592" class="body">Stable right-side review area prevents layout shifts while processing.</text>

  <rect x="552" y="620" width="472" height="102" rx="16" fill="#F7FAFE" stroke="#D8E4F2"/>
  <text x="574" y="648" class="small" style="font-weight:700; fill:#173A63;">Description</text>
  <text x="574" y="684" class="mono">a cinematic sci-fi scene with darth vader in a glowing corridor.</text>

  <rect x="1044" y="620" width="492" height="102" rx="16" fill="#F7FAFE" stroke="#D8E4F2"/>
  <text x="1066" y="648" class="small" style="font-weight:700; fill:#173A63;">Keywords</text>
  <text x="1066" y="684" class="mono">darth vader, corridor, lights, sci-fi</text>

  <rect x="552" y="744" width="472" height="88" rx="16" fill="#F7FAFE" stroke="#D8E4F2"/>
  <text x="574" y="772" class="small" style="font-weight:700; fill:#173A63;">Actions</text>
  <text x="574" y="806" class="mono">standing, pointing</text>

  <rect x="1044" y="744" width="492" height="88" rx="16" fill="#F7FAFE" stroke="#D8E4F2"/>
  <text x="1066" y="772" class="small" style="font-weight:700; fill:#173A63;">Categories</text>
  <text x="1066" y="806" class="mono">sci-fi, cinematic, character</text>

  <rect x="552" y="854" width="472" height="88" rx="16" fill="#F7FAFE" stroke="#D8E4F2"/>
  <text x="574" y="882" class="small" style="font-weight:700; fill:#173A63;">Colors</text>
  <rect x="574" y="900" width="76" height="26" rx="13" fill="#EEF4FD"/><text x="597" y="917" class="chip">blue</text>
  <rect x="660" y="900" width="84" height="26" rx="13" fill="#EEF4FD"/><text x="682" y="917" class="chip">yellow</text>
  <rect x="754" y="900" width="68" height="26" rx="13" fill="#EEF4FD"/><text x="775" y="917" class="chip">black</text>

  <rect x="1044" y="854" width="492" height="88" rx="16" fill="#F7FAFE" stroke="#D8E4F2"/>
  <text x="1066" y="882" class="small" style="font-weight:700; fill:#173A63;">Copyright / IP Risk</text>
  <rect x="1066" y="898" width="62" height="26" rx="13" fill="#FDECEC" stroke="#E8C0BE"/>
  <text x="1084" y="915" class="small" style="font-weight:700; fill:#8D1F19;">HIGH</text>
  <rect x="1140" y="898" width="104" height="26" rx="13" fill="#EEF4FD" stroke="#B7CBE6"/>
  <text x="1162" y="915" class="chip">Star Wars</text>
  <text x="1262" y="916" class="body">91%</text>

  <rect x="552" y="964" width="150" height="48" rx="16" fill="#FFFFFF" stroke="#9DB8DE" stroke-width="2"/>
  <text x="586" y="993" class="step" style="font-size:16px;">Remove Metadata</text>
  <rect x="718" y="964" width="140" height="48" rx="16" fill="#1565C0"/>
  <text x="758" y="993" class="white" style="font:700 16px Roboto, Arial, sans-serif;">Add Metadata</text>

  <rect x="1080" y="964" width="456" height="48" rx="16" fill="#F7FAFE" stroke="#D8E4F2"/>
  <text x="1100" y="993" class="body">Live log below fold. Export sits under metadata, not above primary actions.</text>
</svg>
