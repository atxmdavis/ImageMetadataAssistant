<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="920" viewBox="0 0 1440 920">
  <defs>
    <style>
      .bg { fill: #f4f7fb; }
      .card { fill: #ffffff; stroke: #d7e1ef; stroke-width: 1; }
      .title { font: 700 22px Roboto, Arial, sans-serif; fill: #163a64; }
      .h2 { font: 700 16px Roboto, Arial, sans-serif; fill: #1f4c78; }
      .h3 { font: 700 13px Roboto, Arial, sans-serif; fill: #1f4c78; }
      .body { font: 500 12px Roboto, Arial, sans-serif; fill: #355572; }
      .muted { font: 500 11px Roboto, Arial, sans-serif; fill: #6c7f95; }
      .chip { fill: #eef5ff; stroke: #bcd0ea; stroke-width: 1; }
      .chipText { font: 600 11px Roboto, Arial, sans-serif; fill: #214b79; }
      .btnPrimary { fill: #1565c0; }
      .btnDanger { fill: #b3261e; }
      .btnOutline { fill: #ffffff; stroke: #9fb7db; stroke-width: 1; }
      .btnTextLight { font: 700 12px Roboto, Arial, sans-serif; fill: #ffffff; }
      .btnTextDark { font: 700 12px Roboto, Arial, sans-serif; fill: #1f4c78; }
      .input { fill: #fbfdff; stroke: #c5d6ee; stroke-width: 1; }
      .tabActive { fill: #e8f1fc; stroke: #9fbde3; stroke-width: 1; }
      .tab { fill: #ffffff; stroke: #d7e1ef; stroke-width: 1; }
    </style>
  </defs>

  <rect class="bg" x="0" y="0" width="1440" height="920"/>

  <!-- Header -->
  <rect class="card" x="20" y="16" width="1400" height="112" rx="12"/>
  <text class="title" x="38" y="48">Image Metadata Assistant (Proposed IA/UX)</text>
  <text class="muted" x="38" y="70">3-step flow + presets + clearer processing controls</text>

  <!-- Stepper -->
  <rect class="chip" x="38" y="82" width="170" height="28" rx="14"/>
  <text class="chipText" x="55" y="100">1. Select Source</text>
  <rect class="chip" x="220" y="82" width="190" height="28" rx="14"/>
  <text class="chipText" x="237" y="100">2. Configure Run</text>
  <rect class="chip" x="422" y="82" width="210" height="28" rx="14"/>
  <text class="chipText" x="439" y="100">3. Process + Review + Save</text>

  <!-- Presets -->
  <text class="h3" x="760" y="90">Run Presets</text>
  <rect class="chip" x="840" y="74" width="110" height="28" rx="14"/><text class="chipText" x="858" y="92">Fast Batch</text>
  <rect class="chip" x="958" y="74" width="98" height="28" rx="14"/><text class="chipText" x="980" y="92">Balanced</text>
  <rect class="chip" x="1064" y="74" width="108" height="28" rx="14"/><text class="chipText" x="1080" y="92">High Quality</text>
  <rect class="chip" x="1180" y="74" width="102" height="28" rx="14"/><text class="chipText" x="1198" y="92">Audit Only</text>

  <!-- Left Column -->
  <rect class="card" x="20" y="144" width="320" height="756" rx="12"/>
  <text class="h2" x="36" y="174">Queue + Status</text>

  <rect class="card" x="36" y="188" width="288" height="128" rx="10"/>
  <text class="h3" x="50" y="210">Queue Summary</text>
  <text class="body" x="50" y="234">Total: 219,242</text>
  <text class="body" x="50" y="254">Writable: 219,242</text>
  <text class="body" x="50" y="274">Likely Skip: 124,490</text>
  <text class="body" x="50" y="294">Needs Review: 1,208</text>

  <rect class="card" x="36" y="328" width="288" height="420" rx="10"/>
  <text class="h3" x="50" y="350">Queue Items</text>
  <rect class="chip" x="50" y="360" width="70" height="22" rx="11"/><text class="chipText" x="70" y="375">new</text>
  <rect class="chip" x="126" y="360" width="78" height="22" rx="11"/><text class="chipText" x="144" y="375">written</text>
  <rect class="chip" x="210" y="360" width="74" height="22" rx="11"/><text class="chipText" x="230" y="375">skipped</text>
  <rect class="chip" x="50" y="390" width="108" height="22" rx="11"/><text class="chipText" x="66" y="405">needs review</text>
  <rect class="input" x="50" y="424" width="260" height="28" rx="8"/>
  <text class="muted" x="60" y="442">Search queue...</text>
  <text class="body" x="50" y="476">[written] forest_mushrooms_001.png</text>
  <text class="body" x="50" y="500">[skipped] city_street_112.webp</text>
  <text class="body" x="50" y="524">[review] darth_vader_style_201.png</text>
  <text class="body" x="50" y="548">[new] abstract_neon_993.jpg</text>

  <rect class="btnOutline" x="50" y="764" width="120" height="34" rx="8"/>
  <text class="btnTextDark" x="72" y="786">Next Review</text>
  <rect class="btnOutline" x="178" y="764" width="132" height="34" rx="8"/>
  <text class="btnTextDark" x="206" y="786">Filter Queue</text>

  <rect class="card" x="36" y="810" width="288" height="74" rx="10"/>
  <text class="h3" x="50" y="832">Warnings</text>
  <text class="body" x="50" y="852">2 files read-only. Re-select source.</text>
  <text class="body" x="50" y="870">1 file unsupported format skipped.</text>

  <!-- Middle Column -->
  <rect class="card" x="356" y="144" width="620" height="756" rx="12"/>
  <text class="h2" x="374" y="174">Current Image + Run Controls</text>

  <rect class="card" x="374" y="188" width="584" height="120" rx="10"/>
  <text class="h3" x="390" y="210">Sticky Run Bar</text>
  <rect class="input" x="390" y="226" width="552" height="14" rx="7"/>
  <rect class="btnPrimary" x="390" y="226" width="304" height="14" rx="7"/>
  <text class="body" x="390" y="258">Progress 84,090 / 219,242 (38.4%)</text>
  <text class="body" x="620" y="258">Elapsed 52:14:03</text>
  <text class="body" x="790" y="258">ETA Mar 8, 4:22 PM</text>
  <rect class="btnPrimary" x="390" y="270" width="150" height="28" rx="8"/>
  <text class="btnTextLight" x="420" y="289">Start Processing</text>
  <rect class="btnDanger" x="548" y="270" width="140" height="28" rx="8"/>
  <text class="btnTextLight" x="582" y="289">Stop Processing</text>
  <rect class="btnOutline" x="696" y="270" width="120" height="28" rx="8"/>
  <text class="btnTextDark" x="730" y="289">Export</text>

  <rect class="input" x="374" y="322" width="584" height="440" rx="10"/>
  <text class="muted" x="610" y="550">Image Preview (fixed height, no jitter)</text>
  <text class="body" x="374" y="786">xenomorph_alien_by_H.R._Giger_040449e2...png</text>

  <rect class="card" x="374" y="802" width="584" height="82" rx="10"/>
  <text class="h3" x="390" y="824">Live Log (collapsed by default)</text>
  <rect class="chip" x="860" y="810" width="82" height="22" rx="11"/>
  <text class="chipText" x="880" y="825">Show Log</text>
  <text class="muted" x="390" y="850">[20:32:11] Skipping files with existing metadata...</text>
  <text class="muted" x="390" y="870">[20:32:12] Writing metadata: forest_scene_1209.png</text>

  <!-- Right Column -->
  <rect class="card" x="992" y="144" width="428" height="756" rx="12"/>
  <text class="h2" x="1010" y="174">Generated Metadata</text>

  <rect class="tabActive" x="1010" y="188" width="74" height="28" rx="8"/><text class="chipText" x="1035" y="206">Core</text>
  <rect class="tab" x="1090" y="188" width="108" height="28" rx="8"/><text class="chipText" x="1112" y="206">Discoverability</text>
  <rect class="tab" x="1204" y="188" width="72" height="28" rx="8"/><text class="chipText" x="1229" y="206">Risk</text>

  <text class="h3" x="1010" y="242">Description</text>
  <rect class="input" x="1010" y="250" width="392" height="88" rx="8"/>
  <text class="body" x="1022" y="274">A cinematic sci-fi scene of an alien creature...</text>

  <text class="h3" x="1010" y="366">Keywords</text>
  <rect class="input" x="1010" y="374" width="392" height="56" rx="8"/>
  <text class="body" x="1022" y="398">alien, creature, biomechanical, dark, sci-fi</text>

  <text class="h3" x="1010" y="458">Actions</text>
  <rect class="input" x="1010" y="466" width="392" height="56" rx="8"/>
  <text class="body" x="1022" y="490">standing, watching</text>

  <text class="h3" x="1010" y="550">Categories</text>
  <rect class="input" x="1010" y="558" width="392" height="56" rx="8"/>
  <text class="body" x="1022" y="582">sci-fi, dark fantasy</text>

  <text class="h3" x="1010" y="642">Colors</text>
  <rect class="input" x="1010" y="650" width="392" height="56" rx="8"/>
  <text class="body" x="1022" y="674">black, gray, blue</text>

  <text class="h3" x="1010" y="738">Copyright/IP Risk</text>
  <rect class="chip" x="1010" y="746" width="58" height="24" rx="12"/><text class="chipText" x="1028" y="762">LOW</text>
  <rect class="chip" x="1074" y="746" width="76" height="24" rx="12"/><text class="chipText" x="1092" y="762">MEDIUM</text>
  <rect class="chip" x="1156" y="746" width="58" height="24" rx="12"/><text class="chipText" x="1174" y="762">HIGH</text>
  <rect class="chip" x="1010" y="776" width="112" height="24" rx="12"/><text class="chipText" x="1035" y="792">none 0%</text>

  <rect class="btnOutline" x="1010" y="834" width="146" height="38" rx="9"/>
  <text class="btnTextDark" x="1040" y="857">Remove Metadata</text>
  <rect class="btnPrimary" x="1164" y="834" width="142" height="38" rx="9"/>
  <text class="btnTextLight" x="1202" y="857">Add Metadata</text>
</svg>
